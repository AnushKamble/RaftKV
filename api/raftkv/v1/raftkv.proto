syntax = "proto3";

package raftkv.v1;

option go_package = "raftkv/gen/raftkv/v1;raftkvv1";

// RaftService defines inter-node peer consensus RPCs.
service RaftService {
  rpc RequestVote(RequestVoteArgs) returns (RequestVoteReply);
  rpc AppendEntries(AppendEntriesArgs) returns (AppendEntriesReply);
  rpc InstallSnapshot(InstallSnapshotArgs) returns (InstallSnapshotReply);
}

// KVService defines client-facing key-value storage operations.
service KVService {
  rpc Put(PutRequest) returns (PutReply);
  rpc Get(GetRequest) returns (GetReply);
  rpc Delete(DeleteRequest) returns (DeleteReply);
  rpc CompareAndSwap(CompareAndSwapRequest) returns (CompareAndSwapReply);
  rpc GetStatus(GetStatusRequest) returns (GetStatusReply);
}

// --- Raft Peer Messages ---

message RequestVoteArgs {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteReply {
  uint64 term = 1;
  bool vote_granted = 2;
}

message LogEntryProto {
  uint64 index = 1;
  uint64 term = 2;
  bytes data = 3;
}

message AppendEntriesArgs {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntryProto entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesReply {
  uint64 term = 1;
  bool success = 2;
  uint64 conflict_index = 3;
  uint64 conflict_term = 4;
}

message InstallSnapshotArgs {
  uint64 term = 1;
  string leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
  bool done = 6;
}

message InstallSnapshotReply {
  uint64 term = 1;
}

// --- KV Client Messages ---

message PutRequest {
  string client_id = 1;
  uint64 request_id = 2;
  string key = 3;
  string value = 4;
}

message PutReply {
  bool success = 1;
  string error_code = 2;
  string leader_hint = 3;
  uint64 commit_index = 4;
}

message GetRequest {
  string client_id = 1;
  uint64 request_id = 2;
  string key = 3;
}

message GetReply {
  bool success = 1;
  string error_code = 2;
  string leader_hint = 3;
  string value = 4;
  bool found = 5;
  uint64 commit_index = 6;
}

message DeleteRequest {
  string client_id = 1;
  uint64 request_id = 2;
  string key = 3;
}

message DeleteReply {
  bool success = 1;
  string error_code = 2;
  string leader_hint = 3;
  bool found = 4;
  uint64 commit_index = 5;
}

message CompareAndSwapRequest {
  string client_id = 1;
  uint64 request_id = 2;
  string key = 3;
  string expected_value = 4;
  string new_value = 5;
}

message CompareAndSwapReply {
  bool success = 1;
  string error_code = 2;
  string leader_hint = 3;
  bool swapped = 4;
  string value = 5;
  uint64 commit_index = 6;
}

message GetStatusRequest {}

message GetStatusReply {
  string node_id = 1;
  string role = 2;
  uint64 term = 3;
  string leader_id = 4;
  uint64 last_log_index = 5;
  uint64 last_log_term = 6;
  uint64 commit_index = 7;
  uint64 last_applied = 8;
  uint64 snapshot_index = 9;
  map<string, uint64> peer_match_indices = 10;
}
